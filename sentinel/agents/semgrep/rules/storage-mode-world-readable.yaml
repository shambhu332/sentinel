rules:
  - id: storage-mode-world-readable
    languages: [java]
    severity: ERROR
    message: >-
      MODE_WORLD_READABLE lets any installed app read this file/preference,
      bypassing Android's per-app sandbox. Deprecated since API 17.
    patterns:
      - pattern-either:
          - pattern: $X.openFileOutput($N, Context.MODE_WORLD_READABLE)
          - pattern: $X.openFileOutput($N, MODE_WORLD_READABLE)
          - pattern: $X.getSharedPreferences($N, Context.MODE_WORLD_READABLE)
          - pattern: $X.getSharedPreferences($N, MODE_WORLD_READABLE)
          - pattern: $X.getDir($N, Context.MODE_WORLD_READABLE)
          - pattern: $X.openOrCreateDatabase($N, MODE_WORLD_READABLE, ...)
    metadata:
      sentinel_vuln_class: INSECURE_STORAGE
      sentinel_severity: HIGH
      sentinel_confidence: "0.90"
      owasp_masvs: MSTG-STORAGE-2
      cwe: CWE-732
