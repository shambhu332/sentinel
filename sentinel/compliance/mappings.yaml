# SENTINEL compliance mappings — agent_id / vuln_class → regulation citations.
#
# This is a hand-curated table. Reviewers should consult the underlying
# regulation text; this mapping is a starting point, not legal advice.
#
# Schema:
#   <agent_id_or_glob>:
#     citations:
#       - { framework: GDPR,    article: "Art. 32(1)(a)", note: "..." }
#       - { framework: HIPAA,   rule:    "164.312(a)(2)(iv)", note: "..." }
#       - { framework: PCI-DSS, requirement: "3.4",          note: "..." }
#
# Glob support is intentional simple: trailing "*" only.

# -----------------------------------------------------------------
# Secret leakage / key material
# -----------------------------------------------------------------
A_004:
  citations:
    - { framework: PCI-DSS, requirement: "3.4",   note: "Cardholder data must not be stored in cleartext; embedded API keys for payment infrastructure violate this." }
    - { framework: PCI-DSS, requirement: "3.5.1", note: "Cryptographic keys must be protected against disclosure and misuse." }
    - { framework: GDPR,    article: "Art. 32(1)(a)", note: "Pseudonymisation and encryption keys must be protected as part of appropriate technical measures." }
    - { framework: HIPAA,   rule: "164.312(a)(2)(iv)", note: "Encryption and decryption keys must be safeguarded." }

C_005:   # hardcoded crypto keys
  citations:
    - { framework: PCI-DSS, requirement: "3.5.1", note: "Cryptographic keys must be protected." }
    - { framework: GDPR,    article: "Art. 32(1)(a)" }

C_017:   # hardcoded certificate / private-key files
  citations:
    - { framework: PCI-DSS, requirement: "3.5.1" }
    - { framework: PCI-DSS, requirement: "4.2",   note: "Strong cryptography during transmission depends on key secrecy." }

# -----------------------------------------------------------------
# Transport security
# -----------------------------------------------------------------
N_001:   # cleartext traffic
  citations:
    - { framework: PCI-DSS, requirement: "4.1",   note: "Strong cryptography and security protocols must be used during transmission over open networks." }
    - { framework: HIPAA,   rule: "164.312(e)(1)", note: "Implement technical security measures to guard against unauthorized access to ePHI in transit." }
    - { framework: GDPR,    article: "Art. 32(1)(a)" }

N_008:   # insecure TrustManager
  citations:
    - { framework: PCI-DSS, requirement: "4.1.1" }
    - { framework: HIPAA,   rule: "164.312(e)(2)(ii)", note: "Encryption of transmitted ePHI." }

# -----------------------------------------------------------------
# Component / authorisation
# -----------------------------------------------------------------
I_001:   # unprotected exported component
  citations:
    - { framework: GDPR,    article: "Art. 32(1)(b)", note: "Ensure ongoing confidentiality and integrity of processing systems." }
    - { framework: HIPAA,   rule: "164.312(a)(1)",    note: "Access controls must restrict to authorized users." }

B_008:   # client-side trust / role checks
  citations:
    - { framework: PCI-DSS, requirement: "7.1",   note: "Restrict access to system components on a need-to-know basis — client-side enforcement is not sufficient." }

# -----------------------------------------------------------------
# Privacy / consent
# -----------------------------------------------------------------
PRIV_001:
  citations:
    - { framework: GDPR,    article: "Art. 6(1)(a)", note: "Lawful basis: explicit consent must precede collection." }
    - { framework: GDPR,    article: "Art. 7",        note: "Conditions for consent." }
    - { framework: GDPR,    article: "Art. 5(1)(c)",  note: "Data minimisation." }
    - { framework: DPDP,    section: "6(1)",          note: "Consent must be free, specific, informed and unambiguous." }
    - { framework: CCPA,    section: "1798.100(b)" }

SCA_002:
  citations:
    - { framework: GDPR,    article: "Art. 28",   note: "Processor obligations: third-party SDKs act as processors and must be contractually bound." }
    - { framework: GDPR,    article: "Art. 5(1)(c)", note: "Data minimisation — SDK permission scope must match purpose." }

# -----------------------------------------------------------------
# Crypto integrity
# -----------------------------------------------------------------
C_006:    # ECB mode
  citations:
    - { framework: PCI-DSS, requirement: "3.4.1", note: "Cryptographic primitives must be strong and used correctly." }
    - { framework: HIPAA,   rule: "164.312(a)(2)(iv)" }

C_018:    # roll-your-own crypto / hardcoded IV / XOR loops
  citations:
    - { framework: PCI-DSS, requirement: "3.4",   note: "Cardholder data rendered unreadable requires industry-standard cryptography." }
    - { framework: HIPAA,   rule: "164.312(e)(2)(ii)" }
    - { framework: GDPR,    article: "Art. 32(1)(a)" }

# -----------------------------------------------------------------
# Logging / pre-shipped backdoors
# -----------------------------------------------------------------
LOGIC_001:
  citations:
    - { framework: PCI-DSS, requirement: "6.4.4", note: "Test data and accounts must be removed before production release." }
    - { framework: GDPR,    article: "Art. 32(1)(b)" }

# -----------------------------------------------------------------
# Resource availability / DoS
# -----------------------------------------------------------------
RES_002:
  citations:
    - { framework: PCI-DSS, requirement: "10.6", note: "Detect and respond to anomalies; resource exhaustion masks attack." }
    - { framework: HIPAA,   rule: "164.308(a)(1)(ii)(B)", note: "Risk management — availability of ePHI." }
    - { framework: SOC2,    section: "A1.1",          note: "Availability — system processing capacity." }

# -----------------------------------------------------------------
# SOC2 — Trust Service Criteria cross-cutting additions.
# Most agents already mapped above pick up SOC2 here via prefix globs.
# -----------------------------------------------------------------
A_004:
  citations:
    - { framework: PCI-DSS, requirement: "3.4" }
    - { framework: PCI-DSS, requirement: "3.5.1" }
    - { framework: GDPR,    article: "Art. 32(1)(a)" }
    - { framework: HIPAA,   rule: "164.312(a)(2)(iv)" }
    - { framework: SOC2,    section: "CC6.1",         note: "Logical access — restrict access to system credentials." }
    - { framework: SOC2,    section: "CC6.7",         note: "Restrict the transmission, movement, and removal of information." }

N_001:
  citations:
    - { framework: PCI-DSS, requirement: "4.1" }
    - { framework: HIPAA,   rule: "164.312(e)(1)" }
    - { framework: GDPR,    article: "Art. 32(1)(a)" }
    - { framework: SOC2,    section: "CC6.6",         note: "Restrict and monitor logical access via network boundaries." }

I_001:
  citations:
    - { framework: GDPR,    article: "Art. 32(1)(b)" }
    - { framework: HIPAA,   rule: "164.312(a)(1)" }
    - { framework: SOC2,    section: "CC6.1",         note: "Logical access controls restrict to authorised users." }

PRIV_001:
  citations:
    - { framework: GDPR,    article: "Art. 6(1)(a)" }
    - { framework: GDPR,    article: "Art. 7" }
    - { framework: GDPR,    article: "Art. 5(1)(c)" }
    - { framework: DPDP,    section: "6(1)" }
    - { framework: CCPA,    section: "1798.100(b)" }
    - { framework: SOC2,    section: "P1.1",          note: "Privacy — provide notice about collection use disclosure retention." }
    - { framework: SOC2,    section: "P3.1",          note: "Privacy — collect personal information consistent with notice." }

SCA_004:
  citations:
    - { framework: SOC2,    section: "CC7.1",         note: "Detect anomalies — third-party library behaviour outside expected norm." }
    - { framework: GDPR,    article: "Art. 28",       note: "Processor obligations — third-party SDKs are processors." }
    - { framework: ISO27001, section: "A.14.2.5",     note: "Secure system engineering principles — verify behaviour of third-party components." }

# -----------------------------------------------------------------
# ISO 27001 Annex A — cross-cutting additions for the agents most
# commonly cited in ISO audits. We attach ISO refs in addition to
# the framework-specific clauses already mapped above.
# -----------------------------------------------------------------
A_004:
  citations:
    - { framework: PCI-DSS, requirement: "3.4" }
    - { framework: PCI-DSS, requirement: "3.5.1" }
    - { framework: GDPR,    article: "Art. 32(1)(a)" }
    - { framework: HIPAA,   rule: "164.312(a)(2)(iv)" }
    - { framework: SOC2,    section: "CC6.1" }
    - { framework: SOC2,    section: "CC6.7" }
    - { framework: ISO27001, section: "A.8.24",       note: "Use of cryptography — keys must be managed throughout their lifecycle." }
    - { framework: ISO27001, section: "A.5.10",       note: "Acceptable use of information — credentials are information assets." }

N_001:
  citations:
    - { framework: PCI-DSS, requirement: "4.1" }
    - { framework: HIPAA,   rule: "164.312(e)(1)" }
    - { framework: GDPR,    article: "Art. 32(1)(a)" }
    - { framework: SOC2,    section: "CC6.6" }
    - { framework: ISO27001, section: "A.8.20",       note: "Network security — controls to secure information in networks." }
    - { framework: ISO27001, section: "A.8.21",       note: "Security of network services — service-level security requirements." }

I_001:
  citations:
    - { framework: GDPR,    article: "Art. 32(1)(b)" }
    - { framework: HIPAA,   rule: "164.312(a)(1)" }
    - { framework: SOC2,    section: "CC6.1" }
    - { framework: ISO27001, section: "A.8.3",        note: "Information access restriction — restrict access to information and other assets." }

PRIV_001:
  citations:
    - { framework: GDPR,    article: "Art. 6(1)(a)" }
    - { framework: GDPR,    article: "Art. 7" }
    - { framework: GDPR,    article: "Art. 5(1)(c)" }
    - { framework: DPDP,    section: "6(1)" }
    - { framework: CCPA,    section: "1798.100(b)" }
    - { framework: SOC2,    section: "P1.1" }
    - { framework: SOC2,    section: "P3.1" }
    - { framework: ISO27001, section: "A.5.34",       note: "Privacy and protection of PII — privacy by design and default." }

C_018:
  citations:
    - { framework: PCI-DSS, requirement: "3.4" }
    - { framework: HIPAA,   rule: "164.312(e)(2)(ii)" }
    - { framework: GDPR,    article: "Art. 32(1)(a)" }
    - { framework: ISO27001, section: "A.8.24",       note: "Use of cryptography — only vetted algorithms and implementations." }

LOGIC_001:
  citations:
    - { framework: PCI-DSS, requirement: "6.4.4" }
    - { framework: GDPR,    article: "Art. 32(1)(b)" }
    - { framework: ISO27001, section: "A.8.32",       note: "Change management — test and debug code must be removed before production release." }

RES_002:
  citations:
    - { framework: PCI-DSS, requirement: "10.6" }
    - { framework: HIPAA,   rule: "164.308(a)(1)(ii)(B)" }
    - { framework: SOC2,    section: "A1.1" }
    - { framework: ISO27001, section: "A.8.6",        note: "Capacity management — monitor and control resource use." }
