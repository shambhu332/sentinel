; Alembic configuration for SENTINEL.
;
; Hand-written SQL migrations 0001 and 0002 continue to live under
; `migrations/*.sql` and are applied by `scripts/apply_migrations.py`.
; Alembic manages every migration from 0003 onwards so schema changes
; can be reviewed as Python autogen diffs.

[alembic]
script_location = migrations
prepend_sys_path = .
version_locations = migrations/versions
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/sentinel

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
