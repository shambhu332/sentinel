services:

  # ── SENTINEL API ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinel_service:sentineldev@postgres:5432/sentinel
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=sentineldev
      - SENTINEL_LOCAL_LLM_URL=${SENTINEL_LOCAL_LLM_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - SENTINEL_JWT_SECRET=${SENTINEL_JWT_SECRET:-changeme-set-in-production}
      - SENTINEL_DEV_AUTH_BYPASS=${SENTINEL_DEV_AUTH_BYPASS:-false}
      - SENTINEL_LOG_LEVEL=${SENTINEL_LOG_LEVEL:-INFO}
      - SENTINEL_MASTER_KEY=${SENTINEL_MASTER_KEY:-}
      - SENTINEL_ENCRYPT_WORKSPACES=${SENTINEL_ENCRYPT_WORKSPACES:-false}
    volumes:
      - sentinel_workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── RQ WORKER (report generation + background jobs) ─────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -m rq worker sentinel-default
      --url redis://redis:6379/0
      --with-scheduler
    environment:
      - DATABASE_URL=postgresql://sentinel_service:sentineldev@postgres:5432/sentinel
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - SENTINEL_LOCAL_LLM_URL=${SENTINEL_LOCAL_LLM_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - SENTINEL_LOG_LEVEL=${SENTINEL_LOG_LEVEL:-INFO}
      - SENTINEL_MASTER_KEY=${SENTINEL_MASTER_KEY:-}
    volumes:
      - sentinel_workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── POSTGRESQL (T1 — events, findings, audit log) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sentinel_service
      - POSTGRES_PASSWORD=sentineldev
      - POSTGRES_DB=sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_service -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── REDIS (token revocation, LLM cache, rate limiting, job queue) ───────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── QDRANT (T2 — semantic vector search) ────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── NEO4J (T3 — exploit chain graph) ────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sentineldev
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  sentinel_workspace:
