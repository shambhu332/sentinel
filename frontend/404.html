<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · SENTINEL</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-6);
      text-align: center;
    }
    .nf-code {
      font-family: var(--font-mono);
      font-size: clamp(72px, 14vw, 144px);
      line-height: 1;
      letter-spacing: -0.04em;
      background: var(--gradient);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: var(--space-4);
    }
    .nf-msg { font-size: var(--fs-lg); color: var(--text); margin-bottom: var(--space-2); }
    .nf-sub { color: var(--text-dim); margin-bottom: var(--space-8); }
    .nf-actions { display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <div>
      <div class="nf-code">404</div>
      <h1 class="nf-msg">Scan target not found.</h1>
      <p class="nf-sub">The URL you followed doesn't match any phase in our pipeline.</p>
      <div class="nf-actions">
        <a href="./index.html" class="btn btn-primary">← Back to home</a>
        <a href="./app.html#dashboard" class="btn btn-secondary">Open dashboard →</a>
      </div>
    </div>
  </main>
  <script type="module" src="./js/grid-bg.js"></script>
</body>
</html>
