[tool.poetry]
name = "sentinel"
version = "0.1.0"
description = "Autonomous multi-agent mobile security platform"
authors = ["Shambhu <you@example.com>"]
readme = "README.md"
packages = [{include = "sentinel"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
httpx = "^0.27.0"
click = "^8.1.7"
rich = "^13.9.0"
python-dotenv = "^1.0.1"
androguard = "^4.1.2"
tree-sitter = "^0.23.0"
tree-sitter-languages = "^1.10.2"
chromadb = "^0.5.15"
networkx = "^3.4.2"
sqlalchemy = "^2.0.35"
aiosqlite = "^0.20.0"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
websockets = "^13.0"
jinja2 = "^3.1.4"
mitmproxy = "^12.2.3"
frida = "16.5.7"
python-multipart = "^0.0.29"
aiofiles = "^25.1.0"
semgrep = "^1.163.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
packaging = "^24.0"
tree-sitter-java = "^0.23.5"
unidiff = "^0.7.5"
pyyaml = "^6.0.2"
# Production memory backend — optional, only installed with the
# `production` extra so the OSS / CLI install stays light.
redis = {version = "^5.0.0", optional = true}

[tool.poetry.extras]
production = ["redis"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
fakeredis = "^2.26.0"

[tool.poetry.scripts]
sentinel = "sentinel.cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "F401"]
"sentinel/api/routes/*.py" = ["B008", "E501"]
"sentinel/api/**" = ["E501"]
"sentinel/cli.py" = ["PLR0912", "E402"]
"sentinel/core/config.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: real-corpus / external-resource tests; opt in with `-m integration`",
]
# Deselect integration tests from the default run; opt in with `-m integration`.
addopts = "-m 'not integration'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
