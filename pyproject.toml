[tool.poetry]
name = "sentinel"
version = "0.1.0"
description = "Autonomous multi-agent mobile security platform"
authors = ["Shambhu <you@example.com>"]
readme = "README.md"
packages = [{include = "sentinel"}]
# Non-Python data shipped inside the package. Without this Poetry's
# wheel build drops .json / .yaml / .sql, breaking:
#   - sentinel.profiles.loader (banking/ecommerce/edu profiles)
#   - sentinel.compliance.mapper (mappings.yaml)
#   - sentinel.impact.calculator (loss_schedule.yaml)
include = [
    "sentinel/profiles/data/*.json",
    "sentinel/compliance/mappings.yaml",
    "sentinel/impact/loss_schedule.yaml",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
httpx = "^0.27.0"
click = "^8.1.7"
rich = "^13.9.0"
python-dotenv = "^1.0.1"
androguard = "^4.1.2"
tree-sitter = "^0.23.0"
tree-sitter-languages = "^1.10.2"
chromadb = "^0.5.15"
networkx = "^3.4.2"
sqlalchemy = "^2.0.35"
aiosqlite = "^0.20.0"
# Phase 1.1 — Postgres T1 backend (default in production).
# asyncpg is the driver, alembic manages migrations alongside the
# hand-written SQL under migrations/. Both are core deps because the
# API + worker + janitor all import from sentinel.memory.postgres.
asyncpg = "^0.29.0"
alembic = "^1.13.0"
# Phase 1.2 — Qdrant vector store for T2 semantic search.
# qdrant-client is a hard dep because the memory factory always tries
# it first when QDRANT_URL is set. sentence-transformers is the local
# embedding model — we never send code to a cloud LLM for embeddings.
qdrant-client = "^1.11.0"
sentence-transformers = "^3.2.0"
# Phase 1.2 — Neo4j graph store for T3.
neo4j = "^5.24.0"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
websockets = "^13.0"
jinja2 = "^3.1.4"
mitmproxy = "^12.2.3"
frida = "16.5.7"
python-multipart = "^0.0.29"
aiofiles = "^25.1.0"
semgrep = "^1.163.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
packaging = "^24.0"
tree-sitter-java = "^0.23.5"
unidiff = "^0.7.5"
pyyaml = "^6.0.2"
# Redis is a core dep: JWT revocation, LLM cache, rate limiting, and job queue.
redis = "^5.0.0"
# RQ (Redis Queue) — async background jobs for report generation and scans.
rq = "^1.16.0"
# Symbolic execution for D_052 SymbolicIntentAgent — optional, ~80MB.
# Agent degrades gracefully when missing.
z3-solver = {version = "^4.13.0", optional = true}
# Appium + UIAutomator2 for autonomous UI driving (self-login, navigation,
# scrolling). Optional — AppiumUIDriver logs a clear install hint when absent.
Appium-Python-Client = {version = "^4.0.0", optional = true}
email-validator = "^2.3.0"
frida-tools = "^13.0.0"

[tool.poetry.extras]
symbolic = ["z3-solver"]
appium = ["Appium-Python-Client"]
all = ["z3-solver", "Appium-Python-Client"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
fakeredis = "^2.26.0"
# Phase 1.1 — Postgres integration tests spin up a real container
# via testcontainers so we exercise RLS + BRIN + partitioning
# behaviour we can't reproduce against fakeredis/SQLite.
testcontainers = {extras = ["postgres"], version = "^4.7.0"}

[tool.poetry.scripts]
sentinel = "sentinel.cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "F401"]
"sentinel/api/routes/*.py" = ["B008", "E501"]
"sentinel/api/**" = ["E501"]
"sentinel/cli.py" = ["PLR0912", "E402"]
"sentinel/core/config.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: real-corpus / external-resource tests; opt in with `-m integration`",
    "benchmark: FP-reduction and precision-recall benchmarks; opt in with `-m benchmark`",
    "e2e: end-to-end tests requiring a live LLM provider; opt in with `-m e2e`",
]
# Deselect slow tests from the default run.
addopts = "-m 'not integration and not benchmark and not e2e'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
